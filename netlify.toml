# Atlas ORL / Atlas ENT — jgarciaarteaga.pro
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send visitors whose browser prefers English to /en/, everyone else to /es/.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/holo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
